<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101216"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/control/manifest.webmanifest"><title>Kage Control</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}body{margin:0;min-height:100vh;background:#101216;color:#f5f7fa;display:grid;place-items:center}main{width:min(100%,980px);padding:14px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}h1,h2{margin:0}h1{font-size:24px}h2{font-size:16px;color:#cbd2dc;margin-bottom:10px}#status,.hint{color:#8995a4;font-size:12px}.auth{display:flex;gap:7px}input,button{border:0;border-radius:12px;font:inherit}input{width:150px;padding:10px;background:#20242b;color:white}button{color:white;font-weight:750}.save{padding:10px 14px;background:#3178f6}.stop{padding:12px 18px;background:#be3143}#controls{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;justify-items:center}.panel{width:100%;padding:14px;border-radius:22px;background:#191c22;text-align:center}.stick{position:relative;width:min(30vw,230px);height:min(30vw,230px);min-width:180px;min-height:180px;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#303844 0 18%,#252c35 19% 55%,#1d2229 56%);touch-action:none}.stick:before{content:"";position:absolute;inset:5%;background:linear-gradient(180deg,#4385f422,#4385f40b 43%,#4385f40b 57%,#4385f422);clip-path:polygon(25% 0,75% 0,60% 42%,60% 58%,75% 100%,25% 100%,40% 58%,40% 42%);pointer-events:none}.knob{position:absolute;z-index:1;width:58px;height:58px;border-radius:50%;background:#4285f4;box-shadow:0 4px 16px #0009;transform:translate(-50%,-50%);pointer-events:none}.labels{display:flex;justify-content:space-between;margin:7px 10px 0;color:#8995a4;font-size:12px}.middle{display:grid;gap:12px;justify-items:center}.pad{display:grid;grid-template-columns:repeat(3,78px);grid-template-rows:repeat(3,62px);gap:9px;justify-content:center}.servo{background:#2a3039;font-size:27px;touch-action:manipulation}.servo:active{background:#3178f6}.up{grid-column:2}.left{grid-column:1;grid-row:2}.calibrate{grid-column:2;grid-row:2;font-size:10px;background:#3d5268;padding:4px}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.calibration .servo{outline:2px solid #d89a36}.calibration .calibrate{background:#b8781f}.mode{min-height:16px;color:#d5a64d;font-size:11px;margin-top:7px}.settings{margin-top:12px;padding:12px 16px;border-radius:18px;background:#191c22}.settings summary{cursor:pointer;font-weight:750;color:#cbd2dc}.settings-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px}.setting{display:grid;grid-template-columns:1fr auto;gap:6px;text-align:left;color:#aeb8c5;font-size:12px}.setting input{grid-column:1/3;width:100%;padding:0;accent-color:#4285f4}.setting output{color:#fff;font-weight:750}.settings-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px}.settings-note{margin-right:auto;color:#8995a4;font-size:11px}@media(orientation:portrait){header{flex-wrap:wrap;justify-content:center}#controls{grid-template-columns:1fr}.middle{order:3;grid-template-columns:auto 1fr}.stick{width:min(68vw,280px);height:min(68vw,280px)}.settings-grid{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<header><div><h1>Kage Control</h1><div id="status">Entre la clé Kage une seule fois.</div></div><div class="auth"><input id="key" type="password" placeholder="Clé Kage"><button class="save" id="save">Connecter</button></div></header>
<div id="controls">
<section class="panel"><h2>Chenilles</h2><div class="stick" id="drive-stick"><i class="knob"></i></div><div class="labels"><span>← pivot</span><span>avant ↑</span><span>pivot →</span></div></section>
<div class="middle"><button class="stop" id="stop">STOP</button><p class="hint">Relâcher arrête les chenilles.</p></div>
<section class="panel" id="servo-panel"><h2>Pan / Tilt</h2><div class="pad"><button class="servo up" data-s="up">↑</button><button class="servo left" data-s="left">←</button><button class="servo calibrate" id="calibrate">CALIBRER</button><button class="servo right" data-s="right">→</button><button class="servo down" data-s="down">↓</button></div><div class="mode" id="mode"></div><p class="hint">Horizontal : gauche · zéro · droite<br>Vertical : zéro · haut</p></section>
</div>
<details class="settings"><summary>Réglages du mouvement</summary><div class="settings-grid">
<label class="setting">Puissance chenilles <output data-out="motor_limit">100 %</output><input id="motor_limit" type="range" min="10" max="100" step="5" value="100"></label>
<label class="setting">Amplitude horizontale <output data-out="pan_range">100 %</output><input id="pan_range" type="range" min="10" max="100" step="5" value="100"></label>
<label class="setting">Amplitude verticale <output data-out="tilt_range">50 %</output><input id="tilt_range" type="range" min="10" max="100" step="5" value="50"></label>
<label class="setting">Vitesse des servos <output data-out="servo_speed">50 %</output><input id="servo_speed" type="range" min="10" max="100" step="5" value="50"></label>
</div><div class="settings-actions"><span class="settings-note">Les limites restent mémorisées après redémarrage.</span><button class="save" id="settings-save">Enregistrer</button></div></details>
</main><script>
const key=document.querySelector('#key'),statusEl=document.querySelector('#status'),modeEl=document.querySelector('#mode');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
async function req(path,options={}){const r=await fetch(path,{...options,cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error(r.status===401?'Clé incorrecte':`Erreur ${r.status}`);return r.json()}
async function post(path,data){try{await req(path,{method:'POST',headers:{'content-type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});statusEl.textContent='Connecté'}catch(e){statusEl.textContent=e.message;throw e}}

const stick=document.querySelector('#drive-stick');let pointer=null,drive={left:0,right:0},driveRevision=0,sentRevision=-1,driveSending=false;
function knob(x,y){const r=stick.getBoundingClientRect(),p=31,k=stick.querySelector('.knob');k.style.left=`${p+(r.width-2*p)*(x+1)/2}px`;k.style.top=`${p+(r.height-2*p)*(y+1)/2}px`}
function innerRatio(angle){if(angle<=32)return 1;if(angle<=58)return 1-(angle-32)/26*.28;if(angle<=76)return .72-(angle-58)/18*.52;return .2-(angle-76)/14*1.2}
function mapDrive(x,y){const raw=Math.hypot(x,y),dead=.12;if(raw<=dead)return{left:0,right:0};const speed=clamp((raw-dead)/(1-dead),0,1)*100,angle=Math.atan2(Math.abs(x),Math.abs(y))*180/Math.PI,inside=innerRatio(angle),direction=y<=0?1:-1,turn=x<0?-1:1,average=direction*speed*(1+inside)/2,differential=turn*speed*(1-inside)/2;return{left:Math.round(clamp(average+differential,-100,100)),right:Math.round(clamp(average-differential,-100,100))}}
async function pumpDrive(force=false){if(driveSending||(!force&&sentRevision===driveRevision))return;driveSending=true;const revision=driveRevision,payload={...drive};try{await post('/control/drive',payload);sentRevision=revision}catch(e){}driveSending=false;if(sentRevision!==driveRevision)pumpDrive()}
function updateDrive(e){const r=stick.getBoundingClientRect(),x=clamp((e.clientX-r.left-r.width/2)/(r.width/2-31),-1,1),y=clamp((e.clientY-r.top-r.height/2)/(r.height/2-31),-1,1);knob(x,y);drive=mapDrive(x,y);driveRevision++;pumpDrive()}
function releaseDrive(){pointer=null;drive={left:0,right:0};driveRevision++;knob(0,0);pumpDrive()}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);updateDrive(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)updateDrive(e)});stick.addEventListener('pointerup',releaseDrive);stick.addEventListener('pointercancel',releaseDrive);stick.addEventListener('lostpointercapture',releaseDrive);document.querySelector('#stop').onclick=releaseDrive;knob(0,0);setInterval(()=>{if(pointer!==null){driveRevision++;pumpDrive(true)}},150);

let calibrating=false,panState=0,tiltState=0,holdTimer=null,holdSaved=false;const panel=document.querySelector('#servo-panel'),calibrate=document.querySelector('#calibrate');
function renderCalibration(){panel.classList.toggle('calibration',calibrating);calibrate.textContent=calibrating?'ENREGISTRER 2 S':'CALIBRER';modeEl.textContent=calibrating?'Réglage fin actif : place les servos puis maintiens ENREGISTRER.':''}
async function servoButton(action){if(calibrating){const step=20,delta={pan_delta:0,tilt_delta:0};if(action==='left')delta.pan_delta=-step;if(action==='right')delta.pan_delta=step;if(action==='up')delta.tilt_delta=step;if(action==='down')delta.tilt_delta=-step;await post('/control/servo/adjust',delta);return}if(action==='left')panState=clamp(panState-1,-1,1);if(action==='right')panState=clamp(panState+1,-1,1);if(action==='up')tiltState=1;if(action==='down')tiltState=0;await post('/control/servo/pose',{pan_state:panState,tilt_state:tiltState})}
document.querySelectorAll('[data-s]').forEach(button=>button.onclick=()=>servoButton(button.dataset.s));
calibrate.addEventListener('pointerdown',e=>{e.preventDefault();holdSaved=false;if(!calibrating)return;holdTimer=setTimeout(async()=>{holdSaved=true;await post('/control/servo/calibration/save');calibrating=false;panState=0;tiltState=0;renderCalibration();modeEl.textContent='Zéro enregistré.'},2000)});
calibrate.addEventListener('pointerup',async()=>{if(holdTimer)clearTimeout(holdTimer);holdTimer=null;if(holdSaved)return;if(!calibrating){await post('/control/servo/calibration/begin');calibrating=true;renderCalibration()}else modeEl.textContent='Maintiens ENREGISTRER pendant 2 secondes.'});calibrate.addEventListener('pointercancel',()=>{if(holdTimer)clearTimeout(holdTimer);holdTimer=null});renderCalibration();

const settingNames=['motor_limit','pan_range','tilt_range','servo_speed'];
function renderSettings(){for(const name of settingNames)document.querySelector(`[data-out="${name}"]`).value=`${document.querySelector('#'+name).value} %`}
for(const name of settingNames)document.querySelector('#'+name).addEventListener('input',renderSettings);
async function loadSettings(){const values=await req('/control/settings');for(const name of settingNames)document.querySelector('#'+name).value=values[name];renderSettings()}
document.querySelector('#settings-save').onclick=async()=>{const values=Object.fromEntries(settingNames.map(name=>[name,Number(document.querySelector('#'+name).value)]));await post('/control/settings',values);statusEl.textContent='Réglages enregistrés'};renderSettings();

document.querySelector('#save').onclick=async()=>{try{const r=await fetch('/control/login',{method:'POST',body:key.value.trim(),headers:{'content-type':'text/plain'},credentials:'same-origin'});if(!r.ok)throw Error('Clé incorrecte');key.value='';statusEl.textContent='Connecté';await loadSettings()}catch(e){statusEl.textContent=e.message}};req('/status').then(()=>{statusEl.textContent='Connecté';loadSettings().catch(()=>{})}).catch(()=>{});
</script></body></html>
