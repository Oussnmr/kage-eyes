<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101216"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/control/manifest.webmanifest"><title>Kage Control</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}body{margin:0;min-height:100vh;background:#101216;color:#f5f7fa;display:grid;place-items:center}main{width:min(100%,980px);padding:14px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}h1,h2{margin:0}h1{font-size:24px}h2{font-size:16px;color:#cbd2dc;margin-bottom:10px}#status,.hint{color:#8995a4;font-size:12px}.auth{display:flex;gap:7px}input,button{border:0;border-radius:12px;font:inherit}input{width:150px;padding:10px;background:#20242b;color:white}button{color:white;font-weight:750}.save{padding:10px 14px;background:#3178f6}.stop{padding:12px 18px;background:#be3143}#controls{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;justify-items:center}.panel{width:100%;padding:14px;border-radius:22px;background:#191c22;text-align:center}.stick{position:relative;width:min(30vw,230px);height:min(30vw,230px);min-width:180px;min-height:180px;border-radius:50%;background:radial-gradient(circle,#303844 0 18%,#252c35 19% 55%,#1d2229 56%);touch-action:none}.knob{position:absolute;width:58px;height:58px;border-radius:50%;background:#4285f4;box-shadow:0 4px 16px #0009;transform:translate(-50%,-50%);pointer-events:none}.labels{display:flex;justify-content:space-between;margin:7px 10px 0;color:#8995a4;font-size:12px}.middle{display:grid;gap:12px;justify-items:center}.pad{display:grid;grid-template-columns:repeat(3,78px);grid-template-rows:repeat(3,62px);gap:9px;justify-content:center}.servo{background:#2a3039;font-size:27px;touch-action:manipulation}.servo:active{background:#3178f6}.up{grid-column:2}.left{grid-column:1;grid-row:2}.home{grid-column:2;grid-row:2;font-size:11px;background:#3d5268}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}@media(orientation:portrait){header{flex-wrap:wrap;justify-content:center}#controls{grid-template-columns:1fr}.middle{order:3;grid-template-columns:auto 1fr}.stick{width:min(68vw,280px);height:min(68vw,280px)}}
</style></head><body><main><header><div><h1>Kage Control</h1><div id="status">Entre la clé Kage une seule fois.</div></div><div class="auth"><input id="key" type="password" placeholder="Clé Kage"><button class="save" id="save">Connecter</button></div></header><div id="controls"><section class="panel"><h2>Chenilles</h2><div class="stick" id="drive-stick"><i class="knob"></i></div><div class="labels"><span>← gauche</span><span>avant ↑</span><span>droite →</span></div></section><div class="middle"><button class="stop" id="stop">STOP</button><p class="hint">Un clic définit le mouvement.<br>STOP coupe les chenilles.</p></div><section class="panel"><h2>Pan / Tilt</h2><div class="pad"><button class="servo up" data-s="up">↑</button><button class="servo left" data-s="left">←</button><button class="servo home" data-s="home">CENTRER</button><button class="servo right" data-s="right">→</button><button class="servo down" data-s="down">↓</button></div><p class="hint">Chaque clic déplace doucement.</p></section></div></main><script>
const key=document.querySelector('#key'),status=document.querySelector('#status');let drive={left:0,right:0},servo={pan:50,tilt:0};const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));async function req(p,o={}){let r=await fetch(p,{...o,cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error(r.status===401?'Clé incorrecte':`Erreur ${r.status}`);return r.json()}async function post(p,x){try{await req(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x),keepalive:true});status.textContent='Connecté'}catch(e){status.textContent=e.message}}function knob(x,y){let s=document.querySelector('#drive-stick'),r=s.getBoundingClientRect(),p=31,k=s.querySelector('.knob');k.style.left=`${p+(r.width-2*p)*(x+1)/2}px`;k.style.top=`${p+(r.height-2*p)*(y+1)/2}px`}let stick=document.querySelector('#drive-stick'),active=null;function move(e){let r=stick.getBoundingClientRect(),x=clamp((e.clientX-r.left-r.width/2)/(r.width/2-31),-1,1),y=clamp((e.clientY-r.top-r.height/2)/(r.height/2-31),-1,1),t=Math.round(-y*100),z=Math.round(x*100);knob(x,y);drive={left:clamp(t+z,-100,100),right:clamp(t-z,-100,100)};post('/control/drive',drive)}function release(){active=null;drive={left:0,right:0};knob(0,0);post('/control/drive',drive)}stick.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;stick.setPointerCapture(active);move(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);stick.addEventListener('lostpointercapture',release);knob(0,0);setInterval(()=>{if(drive.left||drive.right)post('/control/drive',drive)},150);document.querySelector('#stop').onclick=release;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{let a=b.dataset.s,n=15;if(a==='up')servo.tilt=clamp(servo.tilt+n,0,100);if(a==='down')servo.tilt=clamp(servo.tilt-n,0,100);if(a==='left')servo.pan=clamp(servo.pan-n,0,100);if(a==='right')servo.pan=clamp(servo.pan+n,0,100);if(a==='home')servo={pan:50,tilt:100};post('/control/servos',servo)});document.querySelector('#save').onclick=async()=>{try{let r=await fetch('/control/login',{method:'POST',body:key.value.trim(),headers:{'content-type':'text/plain'},credentials:'same-origin'});if(!r.ok)throw Error('Clé incorrecte');key.value='';status.textContent='Connecté'}catch(e){status.textContent=e.message}};req('/status').then(()=>status.textContent='Connecté').catch(()=>{});
</script></body></html>
