<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101216"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kage"><link rel="manifest" href="/control/manifest.webmanifest"><title>Kage Control</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}body{margin:0;min-height:100vh;background:#101216;color:#f5f7fa;display:grid;place-items:center}main{width:min(100%,980px);padding:14px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}h1{margin:0;font-size:24px}#status{color:#9ba6b5;font-size:13px}.auth{display:flex;gap:7px}input,button{border:0;border-radius:12px;font:inherit}input{width:150px;padding:10px;background:#20242b;color:inherit}button{color:#fff;font-weight:750}.save,.stop{padding:10px 14px;background:#3178f6}.stop{background:#be3143;min-width:92px}#controls{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;justify-items:center}.panel{width:100%;padding:14px;border-radius:22px;background:#191c22;text-align:center}h2{margin:0 0 10px;font-size:16px;color:#cbd2dc}.stick{position:relative;width:min(30vw,230px);height:min(30vw,230px);min-width:180px;min-height:180px;border-radius:50%;background:radial-gradient(circle,#303844 0 18%,#252c35 19% 55%,#1d2229 56%);touch-action:none;overflow:hidden}.stick::before,.stick::after{content:"";position:absolute;background:#3b4654;opacity:.65}.stick::before{width:1px;top:14px;bottom:14px;left:50%}.stick::after{height:1px;left:14px;right:14px;top:50%}.knob{position:absolute;width:58px;height:58px;border-radius:50%;background:#4285f4;box-shadow:0 4px 16px #0009;transform:translate(-50%,-50%);pointer-events:none}.labels{display:flex;justify-content:space-between;margin:7px 10px 0;color:#8995a4;font-size:12px}.middle{display:grid;gap:12px;justify-items:center}.hint{margin:0;text-align:center;color:#788392;font-size:12px}@media(orientation:portrait){main{padding:18px}header{flex-wrap:wrap;justify-content:center}#controls{grid-template-columns:1fr;gap:15px}.middle{order:3;grid-template-columns:auto 1fr;align-items:center}.stick{width:min(68vw,280px);height:min(68vw,280px)}}
</style></head><body><main><header><div><h1>Kage Control</h1><div id="status">Entre la clé Kage une seule fois.</div></div><div class="auth"><input id="key" type="password" autocomplete="off" placeholder="Clé Kage"><button class="save" id="save">Connecter</button></div></header><div id="controls"><section class="panel"><h2>Chenilles</h2><div class="stick" id="drive-stick"><i class="knob"></i></div><div class="labels"><span>← gauche</span><span>avant ↑</span><span>droite →</span></div></section><div class="middle"><button class="stop" id="stop">STOP</button><p class="hint">Un clic définit le mouvement.<br>STOP coupe les chenilles.</p></div><section class="panel"><h2>Pan / Tilt</h2><div class="stick" id="servo-stick"><i class="knob"></i></div><div class="labels"><span>pan ←</span><span>tilt ↑</span><span>pan →</span></div></section></div></main><script>
const keyInput=document.querySelector('#key'),statusEl=document.querySelector('#status');let drive={left:0,right:0};const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));async function request(path,options={}){const r=await fetch(path,{...options,cache:'no-store',credentials:'same-origin'});if(!r.ok)throw new Error(r.status===401?'Clé incorrecte':`Erreur ${r.status}`);return r.json()}async function post(path,data){try{await request(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data),keepalive:true});statusEl.textContent='Connecté'}catch(e){statusEl.textContent=e.message}}function setKnob(stick,x,y){const r=stick.getBoundingClientRect(),pad=31;stick.querySelector('.knob').style.left=`${pad+(r.width-2*pad)*(x+1)/2}px`;stick.querySelector('.knob').style.top=`${pad+(r.height-2*pad)*(y+1)/2}px`}function bindStick(id,change,center){const stick=document.querySelector(id);let captured=null;const update=e=>{const r=stick.getBoundingClientRect(),x=clamp((e.clientX-r.left-r.width/2)/(r.width/2-31),-1,1),y=clamp((e.clientY-r.top-r.height/2)/(r.height/2-31),-1,1);setKnob(stick,x,y);change(x,y)};stick.addEventListener('pointerdown',e=>{e.preventDefault();captured=e.pointerId;stick.setPointerCapture(captured);update(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===captured)update(e)});stick.addEventListener('pointerup',()=>captured=null);stick.addEventListener('pointercancel',()=>captured=null);setKnob(stick,center.x,center.y)}function updateDrive(x,y){const t=Math.round(-y*100),turn=Math.round(x*100);drive.left=clamp(t+turn,-100,100);drive.right=clamp(t-turn,-100,100);post('/control/drive',drive)}function updateServo(x,y){post('/control/servos',{pan:Math.round((x+1)*50),tilt:Math.round((1-y)*50)})}bindStick('#drive-stick',updateDrive,{x:0,y:0});bindStick('#servo-stick',updateServo,{x:0,y:1});setInterval(()=>{if(drive.left||drive.right)post('/control/drive',drive)},150);document.querySelector('#stop').addEventListener('click',()=>{drive={left:0,right:0};setKnob(document.querySelector('#drive-stick'),0,0);post('/control/drive',drive)});document.querySelector('#save').addEventListener('click',async()=>{try{const r=await fetch('/control/login',{method:'POST',body:keyInput.value.trim(),headers:{'content-type':'text/plain'},credentials:'same-origin'});if(!r.ok)throw new Error('Clé incorrecte');keyInput.value='';statusEl.textContent='Connecté'}catch(e){statusEl.textContent=e.message}});request('/status').then(()=>statusEl.textContent='Connecté').catch(()=>{});
</script></body></html>
