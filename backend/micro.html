<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101216"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/control/manifest.webmanifest"><title>Kage Voice</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 25% 0,#18313a,#101216 48%);color:#f5f7fa}main{width:min(100%,760px);margin:auto;padding:20px 16px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{color:#89eaff;text-decoration:none;font-weight:750}h1{margin:0;font-size:24px}.sub{margin:8px 0 15px;color:#9caab9;font-size:14px}.output{display:flex;gap:7px;margin-bottom:14px}.output button{border:1px solid #385063;border-radius:999px;padding:8px 11px;background:#19222c;color:#b9c7d4;font-weight:750}.output button.active{background:#1bcddd;color:#04191d;border-color:#7ff6ff}.chat{min-height:48vh;max-height:58vh;overflow:auto;padding:14px;border:1px solid #2d3b48;border-radius:22px;background:#111820;box-shadow:inset 0 1px #ffffff0d}.empty{display:grid;place-items:center;min-height:36vh;text-align:center;color:#748394}.msg{max-width:84%;margin:10px 0;padding:11px 13px;border-radius:16px;line-height:1.45;white-space:pre-wrap}.msg small{display:block;margin-bottom:3px;opacity:.7;font-size:11px}.me{margin-left:auto;background:#2263bd;border-bottom-right-radius:4px}.kage{background:#24303b;border-bottom-left-radius:4px}.status{color:#aab8c7;font-size:13px;min-height:22px;margin:13px 4px}.record{display:grid;place-items:center;margin:8px auto 18px;width:96px;height:96px;border:0;border-radius:50%;background:#19d6e8;color:#03191d;font-weight:850;font-size:15px;box-shadow:0 0 0 8px #19d6e822,0 12px 32px #0008}.record.active{background:#f24f61;color:white;animation:pulse 1.2s infinite}.record:disabled{opacity:.45}@keyframes pulse{50%{box-shadow:0 0 0 18px #f24f6122,0 12px 32px #0008}}.composer{display:flex;gap:8px}.composer input{min-width:0;flex:1;padding:13px 14px;border:1px solid #334555;border-radius:13px;background:#19222c;color:white;font:inherit}.composer button{border:0;border-radius:13px;padding:0 16px;background:#3b82f6;color:white;font-weight:800}.note{margin:12px 3px 0;color:#718092;font-size:12px;text-align:center}@media(max-width:480px){main{padding:14px 12px}.chat{min-height:52vh}.msg{max-width:91%}}
</style></head><body><main>
<div class="top"><a class="back" href="/control">← Commandes</a><h1>Kage Voice</h1></div>
<p class="sub">Whisper transcrit ta voix, Kage répond progressivement, Kokoro parle phrase par phrase.</p>
<div class="output"><button data-output="phone" class="active">🔊 iPhone · Kokoro</button><button data-output="pc">🖥️ PC · Kokoro</button><label>Voix <select id="voice"></select></label></div>
<section class="chat" id="chat"><div class="empty" id="empty">La conversation apparaîtra ici.<br>Le micro utilisé est celui de cet appareil.</div></section>
<div class="status" id="status">Prêt à écouter.</div><button class="record" id="record">Micro</button>
<form class="composer" id="composer"><input id="text" autocomplete="off" placeholder="Écrire à Kage…"><button>Envoyer</button></form>
<p class="note">Audio limité à 12 secondes · Safari : Partager → Sur l’écran d’accueil pour le mode web app.</p>
</main><script>
const chat=document.querySelector('#chat'),empty=document.querySelector('#empty'),status=document.querySelector('#status'),record=document.querySelector('#record'),form=document.querySelector('#composer'),text=document.querySelector('#text');let stream,ctx,source,processor,frames=[],recording=false,output=localStorage.getItem('kage-audio-output')||'phone',audioCtx=null,playAt=0,audioTail=Promise.resolve();
const voice=document.querySelector('#voice');
function add(role,content=''){empty?.remove();const node=document.createElement('article');node.className='msg '+(role==='me'?'me':'kage');node.innerHTML='<small>'+ (role==='me'?'Vous':'Kage') +'</small>';node.append(document.createTextNode(content));chat.append(node);chat.scrollTop=chat.scrollHeight;return node}
async function request(path,options={}){const response=await fetch(path,{...options,credentials:'same-origin',cache:'no-store'});if(!response.ok){let detail='Erreur '+response.status;try{detail=(await response.json()).detail||detail}catch(_){}throw Error(detail)}return response}
function setOutput(value){output=value;localStorage.setItem('kage-audio-output',value);document.querySelectorAll('[data-output]').forEach(b=>b.classList.toggle('active',b.dataset.output===value))}document.querySelectorAll('[data-output]').forEach(b=>b.onclick=()=>setOutput(b.dataset.output));setOutput(output);
async function loadVoices(){try{const r=await request('/control/micro/voices'),data=await r.json();for(const item of data.voices){const option=document.createElement('option');option.value=item.id;option.textContent=item.label;option.selected=item.id===data.current;voice.append(option)}}catch(e){voice.innerHTML='<option>Voix indisponibles</option>'}}voice.onchange=async()=>{try{await request('/control/micro/voice',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({voice:voice.value})});status.textContent='Voix Kokoro enregistrée.'}catch(e){status.textContent='Impossible de changer la voix : '+e.message}};loadVoices();
function unlockAudio(){if(!audioCtx)audioCtx=new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();gain.gain.value=.0001;osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.01)}function cue(freq){if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.045,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.13)}
function mergeFrames(){const count=frames.reduce((n,a)=>n+a.length,0),all=new Float32Array(count);let offset=0;for(const frame of frames){all.set(frame,offset);offset+=frame.length}return all}function pcm16k(input,fromRate){const target=16000,length=Math.max(1,Math.round(input.length*target/fromRate)),pcm=new Int16Array(length);for(let i=0;i<length;i++){const pos=i*fromRate/target,lo=Math.floor(pos),hi=Math.min(lo+1,input.length-1),sample=input[lo]+(input[hi]-input[lo])*(pos-lo);pcm[i]=Math.max(-1,Math.min(1,sample))*0x7fff}return pcm}
async function kokoroBuffer(sentence){const r=await request('/control/micro/speech',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:sentence})}),raw=await r.arrayBuffer(),pcm=new Int16Array(raw),buffer=audioCtx.createBuffer(1,pcm.length,16000),samples=buffer.getChannelData(0);for(let i=0;i<pcm.length;i++)samples[i]=pcm[i]/32768;return buffer}function queuePhone(sentence){const prepared=kokoroBuffer(sentence);audioTail=audioTail.then(()=>prepared).then(buffer=>{const src=audioCtx.createBufferSource();src.buffer=buffer;src.connect(audioCtx.destination);const start=Math.max(audioCtx.currentTime+.04,playAt);src.start(start);playAt=start+buffer.duration;return new Promise(resolve=>{src.onended=resolve})}).catch(()=>{});return audioTail}function queueSpeech(sentence){if(!sentence.trim())return;if(output==='pc'){request('/control/micro/pc-speech',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:sentence})}).catch(()=>{});return}queuePhone(sentence)}
function takeSentences(state,finish=false){const result=[];let match;while((match=state.pending.match(/^([\s\S]*?[.!?…])(?:\s+|$)/))){result.push(match[1].trim());state.pending=state.pending.slice(match[0].length)}if(finish&&state.pending.trim()){result.push(state.pending.trim());state.pending=''}return result}
async function streamReply(message){cue(330);status.textContent='Kage réfléchit…';const bubble=add('kage',''),state={pending:''};let total='';try{const response=await request('/ask/stream',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});const reader=response.body.getReader(),decoder=new TextDecoder();let carry='';while(true){const {value,done}=await reader.read();carry+=decoder.decode(value||new Uint8Array(),{stream:!done});const lines=carry.split('\n');carry=lines.pop();for(const line of lines){if(!line.trim())continue;const event=JSON.parse(line);if(event.type==='delta'){const delta=event.text||'';total+=delta;state.pending+=delta;bubble.lastChild.textContent=total;for(const sentence of takeSentences(state))queueSpeech(sentence)}else if(event.type==='done'){const reply=event.result?.reply||'';if(!total&&reply){total=reply;state.pending=reply;bubble.lastChild.textContent=reply}for(const sentence of takeSentences(state,true))queueSpeech(sentence)}else if(event.type==='error'){throw Error(event.detail||'Réponse interrompue')}}if(done)break}if(!bubble.lastChild.textContent)bubble.lastChild.textContent='D’accord.';cue(620);status.textContent='Réponse en cours de lecture…';if(output==='phone')audioTail.then(()=>status.textContent='Prêt à écouter.');else status.textContent='Prêt à écouter.'}catch(e){bubble.lastChild.textContent='Erreur : '+e.message;status.textContent='Réessaie lorsque Kage est prêt.'}}
async function start(){if(!window.isSecureContext){status.textContent='Le micro iPhone exige HTTPS.';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});ctx=new AudioContext();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);frames=[];processor.onaudioprocess=e=>frames.push(new Float32Array(e.inputBuffer.getChannelData(0)));source.connect(processor);processor.connect(ctx.destination);recording=true;record.classList.add('active');record.textContent='Envoyer';status.textContent='Enregistrement en cours…'}catch(e){status.textContent='Micro indisponible : '+(e.name==='NotAllowedError'?'autorisation refusée par Safari.':'ouvre Kage en HTTPS.')}}
async function stop(){recording=false;record.disabled=true;record.classList.remove('active');record.textContent='Micro';processor?.disconnect();source?.disconnect();stream?.getTracks().forEach(t=>t.stop());const raw=mergeFrames();if(raw.length<1600){status.textContent='Enregistrement trop court.';record.disabled=false;return}status.textContent='Whisper transcrit…';try{const r=await request('/control/micro/transcribe',{method:'POST',headers:{'content-type':'application/octet-stream'},body:pcm16k(raw,ctx.sampleRate).buffer}),data=await r.json();add('me',data.heard);await streamReply(data.heard)}catch(e){add('kage','Erreur : '+e.message);status.textContent='Réessaie lorsque le backend est prêt.'}finally{record.disabled=false}}
record.onclick=()=>{unlockAudio();recording?stop():start()};form.onsubmit=e=>{e.preventDefault();const message=text.value.trim();if(!message)return;unlockAudio();text.value='';add('me',message);streamReply(message)};
async function streamReply(message){status.textContent='Envoi vers Kage Voice…';const bubble=add('kage','');try{const r=await request('/control/micro/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})}),data=await r.json();let after=0,reply='';for(let i=0;i<300;i++){const poll=await request('/control/micro/events?request_id='+encodeURIComponent(data.id)+'&after='+after),events=await poll.json();after=events.next||after;for(const event of events.events||[]){if(event.type==='accepted'){status.textContent='Kage Voice réfléchit…';cue(330)}if(event.type==='delta'){reply+=event.text||'';bubble.lastChild.textContent=reply}if(event.type==='error')throw Error(event.detail||'Réponse interrompue');if(event.type==='done'){bubble.lastChild.textContent=reply||event.result?.reply||'Commande exécutée.';status.textContent='Réponse jouée par Kage Voice sur le PC.';cue(620);return}}await new Promise(resolve=>setTimeout(resolve,350))}throw Error('Kage Voice ne répond pas encore')}catch(e){bubble.lastChild.textContent='Erreur : '+e.message;status.textContent='Réessaie lorsque Kage Voice est prêt.'}}
</script></body></html>
