name: Kage typing LVGL visual smoke test

on:
  push:
    branches: [feature/typing-lvgl-simulator]
    paths:
      - .github/workflows/typing-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render four LVGL frames in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          test -s backend/typing_simulator_dist/kage_lvgl.js
          test -s backend/typing_simulator_dist/kage_lvgl.wasm
          command -v google-chrome
          mkdir -p simulator/tests/previews
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kage-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          for frame in 0 1 2 3; do
            URL="http://127.0.0.1:8765/simulator/tests/browser_preview.html?frame=$frame"
            timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=916,800 --virtual-time-budget=6000 --dump-dom "$URL" >"/tmp/frame-$frame-dom.html" 2>"/tmp/frame-$frame-stderr.txt" || true
            if ! grep -q 'data-render-ready="yes"' "/tmp/frame-$frame-dom.html"; then
              cat "/tmp/frame-$frame-dom.html" | tail -25
              cat "/tmp/frame-$frame-stderr.txt" | tail -30
              exit 1
            fi
            timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=916,800 --virtual-time-budget=6000 --screenshot="simulator/tests/previews/frame-$frame.png" "$URL" >/tmp/frame-screenshot.log 2>&1
            test -s "simulator/tests/previews/frame-$frame.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kage-typing-lvgl-4frame-preview
          path: simulator/tests/previews/frame-*.png
      - name: Assemble standalone deployable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/backend/typing_simulator_dist package/tools package/simulator
          cp backend/typing_simulator.html backend/typing_simulator_routes.py package/backend/
          cp backend/typing_simulator_dist/kage_lvgl.js backend/typing_simulator_dist/kage_lvgl.wasm package/backend/typing_simulator_dist/
          cp tools/deploy_typing_simulator.ps1 package/tools/
          cp simulator/README.md package/simulator/
          cat > package/HOW_TO_INSTALL.txt <<'NOTE'
          KAGE LVGL TYPING SIMULATOR — ISOLATED PREVIEW
          1. Extract this ZIP on the M920q, e.g. C:\\Kage\\typing-preview.
          2. Open PowerShell (your usual Windows user).
          3. Check first (does not modify anything):
             & "C:\\Kage\\typing-preview\\tools\\deploy_typing_simulator.ps1" -Repo "C:\\Kage\\typing-preview"
          4. Then install the isolated UI files:
             & "C:\\Kage\\typing-preview\\tools\\deploy_typing_simulator.ps1" -Repo "C:\\Kage\\typing-preview" -Install
          5. Restart your existing Kage backend, then visit:
             http://192.168.129.157:8000/control/simulator

          Your C:\\Kage\\app.py is backed up and receives ONLY 2 route lines.
          Your existing control.html is backed up and gets ONLY the simulator link.
          The script NEVER flashes the Waveshare or edits the robot firmware.
          To undo, restore app.py and control.html from the timestamped backup
          directory under C:\\Kage and restart Kage.
          NOTE
      - name: Upload installable preview (UI + engine + safe deployment)
        uses: actions/upload-artifact@v4
        with:
          name: kage-typing-installable-preview
          path: package/
          if-no-files-found: error
      - name: Commit previews to the isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator/tests/previews/frame-*.png
          git commit -m 'Capture LVGL framebuffer browser smoke frames'
          git pull --rebase origin feature/typing-lvgl-simulator
          git push origin HEAD:feature/typing-lvgl-simulator
